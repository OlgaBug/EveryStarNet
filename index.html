<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | EveryStarNet</title>
    <style>
      /* Стили для всей страницы */
      body, html {
        padding: 0;
        border: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        /* БЕЛЫЙ цвет фона, который будет виден по бокам */
        background-color: #FFFFFF; 
        overflow: hidden;
      }

      /* Стили для самого Canvas (игрового экрана) */
      #unity-canvas {
        /* Имя твоей картинки */
        background-image: url('Рисунок1.png'); 
        
        /* Картинка вписывается целиком, без обрезки (появляются поля по краям) */
        background-size: contain; 
        
        /* Картинка ровно по центру */
        background-position: center center;
        background-repeat: no-repeat;
        
        /* Пока игра грузится, сам Canvas прозрачный, чтобы была видна картинка */
        background-color: transparent; 
      }

      /* Центрируем canvas на ПК */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px;"></canvas>
    <script src="Build/html.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";
        canvas.style.top = "0";
        canvas.style.left = "0";

        document.body.style.display = "block"; // Возвращаем стандартное поведение для мобилок
        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/html.data.unityweb",
        frameworkUrl: "Build/html.framework.js.unityweb",
        codeUrl: "Build/html.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "VarianWay",
        productName: "EveryStarNet",
        productVersion: "1.0",
      });
    </script>
  </body>
</html>
